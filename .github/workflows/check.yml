name: check

# Every push and pull request: the pack must stay installable and every skill's own checks must pass.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every SKILL.md parses as strict YAML (what installers use)
        run: |
          pip install pyyaml==6.0.2
          python - <<'EOF'
          import pathlib, re, sys, yaml
          bad = []
          for f in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              m = re.match(r"---\r?\n(.*?)\r?\n---", f.read_text(encoding="utf-8"), re.S)
              try:
                  d = yaml.safe_load(m.group(1)) if m else None
                  assert d and d.get("name") == f.parent.name and d.get("description"), "name must equal folder; description required"
              except Exception as e:
                  bad.append(f"{f}: {e}")
          print("\n".join(bad) or "all SKILL.md files OK")
          sys.exit(1 if bad else 0)
          EOF
      - name: skills-doctor on this pack (no broken skills, no name collisions)
        run: python skills/skills-doctor/doctor.py --root skills
      - name: Skill tests
        run: |
          pip install pytest==8.3.4
          python skills/skills-doctor/test_doctor.py
          python -m pytest -q skills/hackathon-agent/tests
          python -m unittest skills/orchestrate/scripts/test_limits.py
      - name: Memory vault scripts run on an empty vault
        run: |
          export AGENT_MEMORY_VAULT="$RUNNER_TEMP/vault"
          bash memory/setup.sh
          test -n "$(ls -A "$AGENT_MEMORY_VAULT")"
          if bash memory/setup.sh; then echo "second setup must refuse to overwrite"; exit 1; fi
